<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Card com o preço FIPE: devolvido por GET /consulta/{tipo}/{marcaId}/{modeloId}/{anoId} -->
<section th:fragment="card" class="resultado" aria-labelledby="resultado-titulo">
    <p id="resultado-titulo" class="resultado__rotulo">Preço FIPE</p>
    <p class="resultado__preco" th:text="${preco.valor()}">R$ 0,00</p>
    <dl class="resultado__detalhes">
        <div>
            <dt>Marca</dt>
            <dd th:text="${preco.marca()}">Marca</dd>
        </div>
        <div>
            <dt>Modelo</dt>
            <dd th:text="${preco.modelo()}">Modelo</dd>
        </div>
        <div>
            <dt>Ano / combustível</dt>
            <dd th:text="|${preco.anoDescricao()} · ${preco.combustivel()}|">2018 · Flex</dd>
        </div>
        <div>
            <dt>Código FIPE</dt>
            <dd th:text="${preco.codigoFipe()}">000000-0</dd>
        </div>
        <div>
            <dt>Mês de referência</dt>
            <dd th:text="${preco.mesReferencia()}">mês de ano</dd>
        </div>
    </dl>
</section>

<!-- Erro da consulta: inserido pelo JavaScript no lugar do card -->
<section th:fragment="erro" class="resultado resultado--erro" role="alert">
    <p class="resultado__titulo" th:text="${titulo}">Erro</p>
    <p class="resultado__mensagem" th:text="${mensagem}">Não foi possível concluir a consulta.</p>
</section>

</body>
</html>
