<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="|${titulo ?: 'Erro'} · Consulta FIPE|">Erro · Consulta FIPE</title>
</head>
<body>
<main class="erro">
    <p class="erro__status" th:if="${status}" th:text="${status}">500</p>
    <h1 th:text="${titulo ?: 'Algo deu errado'}">Algo deu errado</h1>
    <p th:text="${mensagem ?: 'Ocorreu um erro inesperado. Tente novamente.'}">Ocorreu um erro inesperado.</p>
    <a th:href="@{/}">Voltar para a consulta</a>
</main>
</body>
</html>
